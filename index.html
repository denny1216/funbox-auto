    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            padding: 20px;
            background-color: #1e1e1e;
            color: white;
            text-align: center;
        }
        .container {
            width: 100%;
            max-width: 650px;
        }
        #mainBtn {
            width: 100%;
            height: 180px;
            font-size: 28px;
            font-weight: bold;
            border-radius: 20px;
            background-color: #06C755;
            color: white;
            border: none;
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(6, 199, 85, 0.4);
            margin-top: 15px;
        }
        #mainBtn:disabled {
            background-color: #555;
            cursor: not-allowed;
        }
        #status {
            margin-top: 15px;
            font-size: 18px;
            color: #00ff00;
        }
        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            margin-top: 15px;
        }
        button.tool-btn {
            padding: 6px 12px;
            background-color: #444;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }
        /* 縣市篩選列 */
        .filter-container {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            justify-content: center;
            margin-top: 15px;
        }
        .filter-btn {
            padding: 6px 10px;
            background-color: #333;
            color: #ccc;
            border: 1px solid #555;
            border-radius: 20px;
            cursor: pointer;
            font-size: 13px;
        }
        .filter-btn.active {
            background-color: #06C755;
            color: white;
            border-color: #06C755;
            font-weight: bold;
        }
        #listContainer {
            margin-top: 20px;
            text-align: left;
            background: #2a2a2a;
            border-radius: 12px;
            padding: 15px;
            max-height: 400px;
            overflow-y: auto;
        }
        .store-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 10px;
            border-bottom: 1px solid #3c3c3c;
            font-size: 14px;
        }
        .store-name a {
            color: #4da6ff;
            text-decoration: none;
        }
        .store-name a:hover {
            text-decoration: underline;
        }
        .city-tag {
            background-color: #444;
            color: #ffcc00;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 11px;
            margin-right: 6px;
        }
        .store-status {
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            cursor: pointer;
            font-weight: bold;
            margin-left: 10px;
            flex-shrink: 0;
        }
        .status-un-drawn { background-color: #ff4444; color: white; }
        .status-drawn { background-color: #2e7d32; color: #ccc; }
    </style>
</head>

        let drawnStatus = [];
        try {
            drawnStatus = JSON.parse(localStorage.getItem('funbox_drawn_status')) || [];
            if (drawnStatus.length !== links.length) {
                drawnStatus = new Array(links.length).fill(false);
            }
        } catch (e) {
            drawnStatus = new Array(links.length).fill(false);
        }

        let currentFilter = "全部";

        const mainBtn = document.getElementById('mainBtn');
        const statusDiv = document.getElementById('status');
        const progressText = document.getElementById('progressText');
        const listContainer = document.getElementById('listContainer');
        const resetBtn = document.getElementById('resetBtn');
        const filterContainer = document.getElementById('filterContainer');

        function initFilters() {
            let cities = ["全部", ...new Set(links.map(item => item.city))];
            filterContainer.innerHTML = '';
            
            cities.forEach(city => {
                let btn = document.createElement('button');
                btn.className = `filter-btn ${city === currentFilter ? 'active' : ''}`;
                let count = city === "全部" ? links.length : links.filter(i => i.city === city).length;
                btn.innerText = `${city} (${count})`;
                btn.addEventListener('click', () => {
                    currentFilter = city;
                    initFilters();
                    renderList();
                });
                filterContainer.appendChild(btn);
            });
        }

        function renderList() {
            listContainer.innerHTML = '';
            let completedCount = 0;
            let displayedCount = 0;

            links.forEach((itemObj, index) => {
                if (drawnStatus[index]) completedCount++;

                // 如果當前篩選不為全部，且縣市不符合，就跳過
                if (currentFilter !== "全部" && itemObj.city !== currentFilter) {
                    return;
                }

                displayedCount++;
                let item = document.createElement('div');
                item.className = 'store-item';

                let nameSpan = document.createElement('span');
                nameSpan.className = 'store-name';
                
                let cityTag = document.createElement('span');
                cityTag.className = 'city-tag';
                cityTag.innerText = itemObj.city;

                let aTag = document.createElement('a');
                aTag.href = itemObj.url;
                aTag.target = '_blank';
                aTag.innerText = `${index + 1}. ${itemObj.name}`;

                nameSpan.appendChild(cityTag);
                nameSpan.appendChild(aTag);

                let statusSpan = document.createElement('span');
                statusSpan.className = `store-status ${drawnStatus[index] ? 'status-drawn' : 'status-un-drawn'}`;
                statusSpan.innerText = drawnStatus[index] ? '已抽選' : '未抽選';
                
                statusSpan.addEventListener('click', () => {
                    drawnStatus[index] = !drawnStatus[index];
                    saveAndRefresh();
                });

                item.appendChild(nameSpan);
                item.appendChild(statusSpan);
                listContainer.appendChild(item);
            });

            progressText.innerText = `總完成進度: ${completedCount} / ${links.length}`;

            let unDrawnFiltered = links.map((item, idx) => ({item, idx})).filter(obj => (currentFilter === "全部" || obj.item.city === currentFilter) && !drawnStatus[obj.idx]);

            if (unDrawnFiltered.length === 0) {
                mainBtn.innerText = `🎉\n【${currentFilter}】項目都抽完囉！`;
                mainBtn.disabled = true;
                statusDiv.innerText = '太棒了！';
            } else {
                mainBtn.innerText = `👉 抽下一個【${currentFilter}】👈`;
                mainBtn.disabled = false;
                statusDiv.innerText = `剩餘未抽: ${unDrawnFiltered.length} 個`;
            }
        }

        function saveAndRefresh() {
            localStorage.setItem('funbox_drawn_status', JSON.stringify(drawnStatus));
            renderList();
        }

        mainBtn.addEventListener('click', () => {
            let target = links.map((item, idx) => ({item, idx})).find(obj => (currentFilter === "全部" || obj.item.city === currentFilter) && !drawnStatus[obj.idx]);

            if (!target) {
                alert('這個分類已經沒有未抽選的項目囉！');
                return;
            }

            let nextIndex = target.idx;
            drawnStatus[nextIndex] = true;
            saveAndRefresh();

            let a = document.createElement('a');
            a.href = links[nextIndex].url;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        });

        resetBtn.addEventListener('click', () => {
            if (confirm('確定要清空所有紀錄嗎？')) {
                drawnStatus = new Array(links.length).fill(false);
                localStorage.removeItem('funbox_drawn_status');
                renderList();
            }
        });

        initFilters();
        renderList();
