<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Funbox 自動化抽獎面板（進階篩選版）</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            padding: 20px;
            background-color: #1e1e1e;
            color: white;
            text-align: center;
        }
        .container {
            width: 100%;
            max-width: 700px;
        }
        #mainBtn {
            width: 100%;
            height: 140px;
            font-size: 24px;
            font-weight: bold;
            border-radius: 20px;
            background-color: #06C755;
            color: white;
            border: none;
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(6, 199, 85, 0.4);
            margin-top: 15px;
        }
        #mainBtn:disabled {
            background-color: #555;
            cursor: not-allowed;
            box-shadow: none;
        }
        #status {
            margin-top: 12px;
            font-size: 16px;
            color: #00ff00;
        }
        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            margin-top: 15px;
        }
        button.tool-btn {
            padding: 6px 12px;
            background-color: #444;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }
        button.tool-btn:hover {
            background-color: #666;
        }
        
        /* 篩選面板樣式 */
        .filter-section {
            background: #2a2a2a;
            border-radius: 12px;
            padding: 12px;
            margin-top: 15px;
            text-align: left;
        }
        .filter-title {
            font-size: 13px;
            color: #aaa;
            margin-bottom: 6px;
        }
        .filter-container {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
        }
        .filter-btn {
            padding: 4px 10px;
            background-color: #333;
            color: #ccc;
            border: 1px solid #555;
            border-radius: 15px;
            cursor: pointer;
            font-size: 12px;
        }
        .filter-btn.active {
            background-color: #06C755;
            color: white;
            border-color: #06C755;
            font-weight: bold;
        }

        #listContainer {
            margin-top: 20px;
            text-align: left;
            background: #2a2a2a;
            border-radius: 12px;
            padding: 15px;
            max-height: 350px;
            overflow-y: auto;
        }
        .store-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 10px;
            border-bottom: 1px solid #3c3c3c;
            font-size: 14px;
        }
        .store-name a {
            color: #4da6ff;
            text-decoration: none;
        }
        .store-name a:hover {
            text-decoration: underline;
        }
        .city-tag {
            background-color: #444;
            color: #ffcc00;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 11px;
            margin-right: 6px;
        }
        .store-status {
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            cursor: pointer;
            font-weight: bold;
            margin-left: 10px;
            flex-shrink: 0;
        }
        .status-un-drawn { background-color: #ff4444; color: white; }
        .status-drawn { background-color: #2e7d32; color: #ccc; }
    </style>
</head>
<body>

    <div class="container">
        <div class="toolbar">
            <span id="progressText" style="font-size: 15px; color: #aaa;">載入中...</span>
            <button class="tool-btn" id="resetBtn">🔄 全部重設紀錄</button>
        </div>

        <!-- 區域篩選 -->
        <div class="filter-section">
            <div class="filter-title">📍 區域篩選</div>
            <div class="filter-container" id="cityFilterContainer"></div>
        </div>

        <!-- 代號/系列篩選 -->
        <div class="filter-section">
            <div class="filter-title">🏷️ 代號/陀螺篩選</div>
            <div class="filter-container" id="seriesFilterContainer"></div>
        </div>

        <button id="mainBtn">👉 載入中... 👈</button>
        <div id="status">請稍候</div>

        <div id="listContainer"></div>
    </div>

    <script>
        // START_OF_LINKS
        const links = [
            { city: "台北市", url: "https://lin.ee/9xvdY8S", name: "BX-10 極限衝擊戰鬥盤" },
            { city: "台北市", url: "https://lin.ee/xxqkyvC", name: "BX-25 戰鬥陀螺X專業收納包" },
            { city: "台北市", url: "https://lin.ee/yP3r8Lq", name: "BX-37 雙重極限衝擊戰鬥盤 豪華組" },
            { city: "台北市", url: "https://lin.ee/QrlSYOm", name: "BX-40 發射器(酒紅)" },
            { city: "台北市", url: "https://lin.ee/TmhBnu9", name: "BX-45 武士魂斬" },
            { city: "台北市", url: "https://lin.ee/zrGLkVA", name: "BX-51 旋風發射器 黑綠" },
            { city: "台北市", url: "https://lin.ee/xe0367ja", name: "BX-57 3V3對戰收納盒 黑" },
            { city: "台北市", url: "https://lin.ee/suYW8By", name: "UX-02 惡魔戰錘" },
            { city: "台北市", url: "https://lin.ee/tratm8F", name: "UX-19 子彈獅鷲H" },
            { city: "台北市", url: "https://lin.ee/XoUgnBE", name: "CX-18 腕龍鞭打 隨機強化組" },
            { city: "台北市", url: "https://lin.ee/qt4wA06", name: "BX-00 暴風天馬" },
            { city: "台北市", url: "https://lin.ee/tn0jSx7", name: "BX-10 極限衝擊戰鬥盤" },
            { city: "台北市", url: "https://lin.ee/x9ejtfu", name: "BX-18 X旋風發射器" },
            { city: "台北市", url: "https://lin.ee/t5DzC6W", name: "BX-25 戰鬥陀螺專業收納包" },
            { city: "台北市", url: "https://lin.ee/O6A5Qu4", name: "BX-26 獨角刺心" },
            { city: "台北市", url: "https://lin.ee/VwXtHSw", name: "BX-32 寬型極限衝擊戰鬥盤" },
            { city: "台北市", url: "https://lin.ee/yDuMJqF", name: "BX-33 皓戰猛虎" },
            { city: "台北市", url: "https://lin.ee/sjANMnS", name: "BX-35 隨機強化組 Vol.04" },
            { city: "台北市", url: "https://lin.ee/nlNO7zU", name: "BX-40 發射器" },
            { city: "台北市", url: "https://lin.ee/uaBy3wh", name: "BX-50 天堂日輪隨機強化組" },
            { city: "台北市", url: "https://lin.ee/PIePz1a", name: "BX-51 旋風發射器 黑綠" },
            { city: "台北市", url: "https://lin.ee/7wo6hoR", name: "BX-57 3on3 戰術陀螺收納盒" },
            { city: "台北市", url: "https://lin.ee/7pFR6OL", name: "UX-02 惡魔戰錘" },
            { city: "台北市", url: "https://lin.ee/wBvFN2J", name: "UX-20 榮耀女武神" },
            { city: "台北市", url: "https://lin.ee/OnkeSxw", name: "CX-18 腕龍鞭打隨機強化組" },
            { city: "台北市", url: "https://lin.ee/uiraH5M", name: "BXG-01 烈焰飛鳳S" },
            { city: "台北市", url: "https://lin.ee/yAnYvar", name: "BXG-04 銀牙烈虎S" },
            { city: "新北市", url: "https://lin.ee/Op8jS9I", name: "BX-00 暴風天馬3-70R" },
            { city: "新北市", url: "https://lin.ee/SUqCHvm", name: "BX-10 極限衝擊戰鬥盤" },
            { city: "新北市", url: "https://lin.ee/OSj26JJ", name: "BX-18 X旋風發射器" },
            { city: "新北市", url: "https://lin.ee/YY093fd", name: "BX-25 戰鬥陀螺X專業收納包" },
            { city: "桃園市", url: "https://lin.ee/UJOyslk", name: "BX-18 X旋風發射器" },
            { city: "桃園市", url: "https://lin.ee/Oya4wBN", name: "BX-26 獨角刺心" },
            { city: "桃園市", url: "https://lin.ee/XQtg8KH", name: "BX-33 皓戰猛虎" },
            { city: "台中市", url: "https://lin.ee/zGvMqnX", name: "BX-10 極限衝擊戰鬥盤" },
            { city: "台中市", url: "https://lin.ee/n3TPmTn", name: "BX-25 戰鬥陀螺X專業收納包" },
            { city: "台中市", url: "https://lin.ee/8V9g0ju", name: "BX-40 發射器(酒紅)" },
            { city: "高雄市", url: "https://liff.line.me/1654883387-DxN9w07M/c/01M0EH6R64EGXBNFCCX385HWSB?q=timeline_post", name: "BX-25 戰鬥陀螺X 專業收納包" },
            { city: "高雄市", url: "https://lin.ee/ZNECVAe", name: "BX-10 極限衝戰鬥盤 850元" },
            { city: "高雄市", url: "https://lin.ee/yOvvsVK", name: "BX-25 戰鬥陀螺專業收納包 850元" },
            { city: "澎湖縣", url: "https://lin.ee/7tvz4ay", name: "BX-10 極限衝擊戰鬥盤" },
            { city: "澎湖縣", url: "https://lin.ee/NogiHFe", name: "BX-32 寬型極限衝擊戰鬥盤" }
        ];
        // END_OF_LINKS

        // 全域狀態紀錄（綁定在原始陣列的 index 上）
        let drawnStatus = [];
        try {
            drawnStatus = JSON.parse(localStorage.getItem('funbox_drawn_status')) || [];
            if (drawnStatus.length !== links.length) {
                drawnStatus = new Array(links.length).fill(false);
            }
        } catch (e) {
            drawnStatus = new Array(links.length).fill(false);
        }

        let currentCityFilter = "全部";
        let currentSeriesFilter = "全部";

        const mainBtn = document.getElementById('mainBtn');
        const statusDiv = document.getElementById('status');
        const progressText = document.getElementById('progressText');
        const listContainer = document.getElementById('listContainer');
        const resetBtn = document.getElementById('resetBtn');
        const cityFilterContainer = document.getElementById('cityFilterContainer');
        const seriesFilterContainer = document.getElementById('seriesFilterContainer');

        // 自動從 name 欄位中提取前綴代號（例如 BX-10、UX-19、CX-18、BXG-01 等）
        function extractSeries(name) {
            let match = name.match(/^([A-Za-z]+-\d+|[A-Za-z]+\d+)/);
            return match ? match[1].toUpperCase() : "其他";
        }

        function initFilters() {
            // 1. 產生區域按鈕
            let cities = ["全部", ...new Set(links.map(item => item.city))];
            cityFilterContainer.innerHTML = '';
            cities.forEach(city => {
                let btn = document.createElement('button');
                btn.className = `filter-btn ${city === currentCityFilter ? 'active' : ''}`;
                btn.innerText = city;
                btn.addEventListener('click', () => {
                    currentCityFilter = city;
                    initFilters();
                    renderList();
                });
                cityFilterContainer.appendChild(btn);
            });

            // 2. 產生系列代號按鈕
            let seriesSet = new Set();
            links.forEach(item => {
                seriesSet.add(extractSeries(item.name));
            });
            let seriesList = ["全部", ...Array.from(seriesSet).sort()];
            
            seriesFilterContainer.innerHTML = '';
            seriesList.forEach(series => {
                let btn = document.createElement('button');
                btn.className = `filter-btn ${series === currentSeriesFilter ? 'active' : ''}`;
                btn.innerText = series;
                btn.addEventListener('click', () => {
                    currentSeriesFilter = series;
                    initFilters();
                    renderList();
                });
                seriesFilterContainer.appendChild(btn);
            });
        }

        function getFilteredItems() {
            return links.map((item, idx) => ({ item, idx })).filter(obj => {
                let matchCity = (currentCityFilter === "全部" || obj.item.city === currentCityFilter);
                let series = extractSeries(obj.item.name);
                let matchSeries = (currentSeriesFilter === "全部" || series === currentSeriesFilter);
                return matchCity && matchSeries;
            });
        }

        function renderList() {
            listContainer.innerHTML = '';
            let completedTotal = drawnStatus.filter(Boolean).length;
            
            let filtered = getFilteredItems();
            let unDrawnFiltered = filtered.filter(obj => !drawnStatus[obj.idx]);

            // 渲染清單
            filtered.forEach(obj => {
                let itemObj = obj.item;
                let index = obj.idx;

                let item = document.createElement('div');
                item.className = 'store-item';

                let nameSpan = document.createElement('span');
                nameSpan.className = 'store-name';
                
                let cityTag = document.createElement('span');
                cityTag.className = 'city-tag';
                cityTag.innerText = itemObj.city;

                let aTag = document.createElement('a');
                aTag.href = itemObj.url;
                aTag.target = '_blank';
                aTag.innerText = `${index + 1}. ${itemObj.name}`;

                nameSpan.appendChild(cityTag);
                nameSpan.appendChild(aTag);

                let statusSpan = document.createElement('span');
                statusSpan.className = `store-status ${drawnStatus[index] ? 'status-drawn' : 'status-un-drawn'}`;
                statusSpan.innerText = drawnStatus[index] ? '已抽選' : '未抽選';
                
                // 點擊個別項目狀態也可以手動切換已抽/未抽
                statusSpan.addEventListener('click', () => {
                    drawnStatus[index] = !drawnStatus[index];
                    saveAndRefresh();
                });

                item.appendChild(nameSpan);
                item.appendChild(statusSpan);
                listContainer.appendChild(item);
            });

            progressText.innerText = `全域總完成進度: ${completedTotal} / ${links.length}`;

            // 更新大按鈕狀態
            if (filtered.length === 0) {
                mainBtn.innerText = `⚠️ 沒有符合條件的項目`;
                mainBtn.disabled = true;
                statusDiv.innerText = '請調整篩選條件';
            } else if (unDrawnFiltered.length === 0) {
                mainBtn.innerText = `🎉\n目前篩選條件的項目都抽完囉！`;
                mainBtn.disabled = true;
                statusDiv.innerText = `符合條件總計 ${filtered.length} 項 (已全部完成)`;
            } else {
                mainBtn.innerText = `👉 開始抽選 (剩餘 ${unDrawnFiltered.length} 項) 👈`;
                mainBtn.disabled = false;
                statusDiv.innerText = `符合篩選共 ${filtered.length} 項，未抽選 ${unDrawnFiltered.length} 項`;
            }
        }

        function saveAndRefresh() {
            localStorage.setItem('funbox_drawn_status', JSON.stringify(drawnStatus));
            renderList();
        }

        // 大按鈕點擊：只從「目前過濾出來且尚未抽選」的項目中抽取下一個
        mainBtn.addEventListener('click', () => {
            let unDrawnFiltered = getFilteredItems().filter(obj => !drawnStatus[obj.idx]);

            if (unDrawnFiltered.length === 0) {
                alert('沒有未抽選的項目了！');
                return;
            }

            // 取得符合條件的第一個未抽選項目
            let targetObj = unDrawnFiltered[0];
            let targetIndex = targetObj.idx;

            // 標記為已抽選
            drawnStatus[targetIndex] = true;
            saveAndRefresh();

            // 開啟抽獎連結
            let a = document.createElement('a');
            a.href = targetObj.item.url;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        });

        resetBtn.addEventListener('click', () => {
            if (confirm('確定要清空所有已抽選的記憶紀錄嗎？')) {
                drawnStatus = new Array(links.length).fill(false);
                localStorage.removeItem('funbox_drawn_status');
                renderList();
            }
        });

        initFilters();
        renderList();
    </script>
</body>
</html>
