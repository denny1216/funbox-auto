        body { font-family: 'Segoe UI', sans-serif; display: flex; flex-direction: column; align-items: center; margin: 0; padding: 20px; background-color: #1e1e1e; color: white; text-align: center; }
        .container { width: 100%; max-width: 700px; }
        #mainBtn { width: 100%; height: 140px; font-size: 24px; font-weight: bold; border-radius: 20px; background-color: #06C755; color: white; border: none; cursor: pointer; box-shadow: 0 10px 25px rgba(6, 199, 85, 0.4); margin-top: 15px; transition: 0.3s; }
        #mainBtn:disabled { background-color: #555; cursor: not-allowed; box-shadow: none; }
        #status { margin-top: 12px; font-size: 16px; color: #00ff00; }
        .toolbar { display: flex; justify-content: space-between; align-items: center; width: 100%; margin-top: 15px; }
        button.tool-btn { padding: 6px 12px; background-color: #444; color: white; border: none; border-radius: 6px; cursor: pointer; }
        button.tool-btn:hover { background-color: #666; }
        .filter-section { background: #2a2a2a; border-radius: 12px; padding: 12px; margin-top: 15px; text-align: left; }
        .filter-title { font-size: 13px; color: #aaa; margin-bottom: 8px; }
        .filter-container { display: flex; flex-wrap: wrap; gap: 5px; }
        .filter-btn { padding: 4px 10px; background-color: #333; color: #ccc; border: 1px solid #555; border-radius: 15px; cursor: pointer; font-size: 12px; }
        .filter-btn.active { background-color: #06C755; color: white; border-color: #06C755; font-weight: bold; }
        .search-input { width: 100%; padding: 10px 15px; border-radius: 8px; border: 1px solid #444; background-color: #222; color: white; font-size: 15px; box-sizing: border-box; outline: none; }
        .search-input:focus { border-color: #06C755; }
        #listContainer { margin-top: 20px; text-align: left; background: #2a2a2a; border-radius: 12px; padding: 15px; max-height: 350px; overflow-y: auto; }
        .store-item { display: flex; justify-content: space-between; align-items: center; padding: 8px 10px; border-bottom: 1px solid #3c3c3c; font-size: 14px; }
        .store-name a { color: #4da6ff; text-decoration: none; }
        .store-name a:hover { text-decoration: underline; }
        .city-tag { background-color: #444; color: #ffcc00; padding: 2px 6px; border-radius: 4px; font-size: 11px; margin-right: 6px; }
        .store-status { padding: 4px 8px; border-radius: 4px; font-size: 12px; cursor: pointer; font-weight: bold; margin-left: 10px; flex-shrink: 0; }
        .status-un-drawn { background-color: #ff4444; color: white; }
        .status-drawn { background-color: #2e7d32; color: #ccc; }
    </style>

            { city: "宜蘭縣", url: "https://lin.ee/Vp4aUiB", name: "BX-33 皓戰猛虎（$295）" },
            { city: "宜蘭縣", url: "https://lin.ee/7UbdwSO", name: "BX-50 天堂日輪 隨機強化組（$350）" },
            { city: "宜蘭縣", url: "https://lin.ee/UVlBzJmk", name: "UX-19 子彈獅鷲H（$550）" },
            { city: "宜蘭縣", url: "https://lin.ee/r4EoEPI", name: "UX-20 榮耀武神LF（$595）" },
            { city: "宜蘭縣", url: "https://lin.ee/WfiQkkY", name: "UX-21 惡魔冥界改造組（$895）" },
            { city: "宜蘭縣", url: "https://lin.ee/TvWlXi0", name: "CX-13 龍王閃擊（$495）" },
            { city: "宜蘭縣", url: "https://lin.ee/o2QZhWI", name: "CX-18 腕龍鞭打 隨機強化組（$350）" },
            { city: "宜蘭縣", url: "https://lin.ee/r9MQCqb", name: "BXG-01 烈焰飛鳳S（$350）" },
            { city: "宜蘭縣", url: "https://lin.ee/90DcANj", name: "BXG-04 銀牙烈虎S（$350）" }
        ];
        // END_OF_LINKS

        let drawnSet = new Set();
        try {
            let stored = JSON.parse(localStorage.getItem('funbox_drawn_urls')) || [];
            drawnSet = new Set(stored);
        } catch (e) {}

        let currentCityFilter = "全部";
        let currentSeriesFilter = "全部";
        let currentSearchTerm = "";

        const mainBtn = document.getElementById('mainBtn');
        const statusDiv = document.getElementById('status');
        const progressText = document.getElementById('progressText');
        const listContainer = document.getElementById('listContainer');
        const resetBtn = document.getElementById('resetBtn');
        const cityFilterContainer = document.getElementById('cityFilterContainer');
        const seriesFilterContainer = document.getElementById('seriesFilterContainer');
        const searchInput = document.getElementById('searchInput');

        function extractSeries(name) {
            let match = name.match(/^([A-Za-z]+-\d+|[A-Za-z]+\d+)/);
            return match ? match[1].toUpperCase() : "其他";
        }

        function initFilters() {
            let cities = ["全部", ...new Set(links.map(item => item.city))];
            cityFilterContainer.innerHTML = '';
            cities.forEach(city => {
                let btn = document.createElement('button');
                btn.className = `filter-btn ${city === currentCityFilter ? 'active' : ''}`;
                btn.innerText = city;
                btn.addEventListener('click', () => { currentCityFilter = city; initFilters(); renderList(); });
                cityFilterContainer.appendChild(btn);
            });

            let seriesSet = new Set();
            links.forEach(item => seriesSet.add(extractSeries(item.name)));
            let seriesList = ["全部", ...Array.from(seriesSet).sort()];
            
            seriesFilterContainer.innerHTML = '';
            seriesList.forEach(series => {
                let btn = document.createElement('button');
                btn.className = `filter-btn ${series === currentSeriesFilter ? 'active' : ''}`;
                btn.innerText = series;
                btn.addEventListener('click', () => { currentSeriesFilter = series; initFilters(); renderList(); });
                seriesFilterContainer.appendChild(btn);
            });
        }

        searchInput.addEventListener('input', (e) => {
            currentSearchTerm = e.target.value.trim().toLowerCase();
            renderList();
        });

        function getFilteredItems() {
            return links.filter(item => {
                let matchCity = (currentCityFilter === "全部" || item.city === currentCityFilter);
                let series = extractSeries(item.name);
                let matchSeries = (currentSeriesFilter === "全部" || series === currentSeriesFilter);
                let matchSearch = true;
                if (currentSearchTerm !== "") {
                    let textToSearch = (item.city + " " + item.name).toLowerCase();
                    matchSearch = textToSearch.includes(currentSearchTerm);
                }
                return matchCity && matchSeries && matchSearch;
            });
        }

        function renderList() {
            listContainer.innerHTML = '';
            let completedTotal = links.filter(item => drawnSet.has(item.url)).length;
            let filtered = getFilteredItems();
            let unDrawnFiltered = filtered.filter(item => !drawnSet.has(item.url));

            filtered.forEach((itemObj, index) => {
                let isDrawn = drawnSet.has(itemObj.url);
                let item = document.createElement('div');
                item.className = 'store-item';
                let nameSpan = document.createElement('span');
                nameSpan.className = 'store-name';
                let cityTag = document.createElement('span');
                cityTag.className = 'city-tag';
                cityTag.innerText = itemObj.city;
                let aTag = document.createElement('a');
                aTag.href = itemObj.url;
                aTag.target = '_blank';
                aTag.innerText = `${index + 1}. ${itemObj.name}`;
                nameSpan.appendChild(cityTag);
                nameSpan.appendChild(aTag);
                let statusSpan = document.createElement('span');
                statusSpan.className = `store-status ${isDrawn ? 'status-drawn' : 'status-un-drawn'}`;
                statusSpan.innerText = isDrawn ? '已抽選' : '未抽選';
                
                statusSpan.addEventListener('click', () => {
                    if (drawnSet.has(itemObj.url)) { drawnSet.delete(itemObj.url); } 
                    else { drawnSet.add(itemObj.url); }
                    saveAndRefresh();
                });
                item.appendChild(nameSpan);
                item.appendChild(statusSpan);
                listContainer.appendChild(item);
            });

            progressText.innerText = `全域總完成度: ${completedTotal} / ${links.length}`;

            if (filtered.length === 0) {
                mainBtn.innerText = `⚠️ 沒有符合條件的項目`;
                mainBtn.disabled = true;
                statusDiv.innerText = '請調整篩選或搜尋關鍵字';
            } else if (unDrawnFiltered.length === 0) {
                mainBtn.innerText = `🎉\n目前篩選條件已全部抽完！`;
                mainBtn.disabled = true;
                statusDiv.innerText = `符合條件總計 ${filtered.length} 項 (已完成)`;
            } else {
                mainBtn.innerText = `👉 開始抽選 (剩餘 ${unDrawnFiltered.length} 項) 👈`;
                mainBtn.disabled = false;
                statusDiv.innerText = `符合篩選共 ${filtered.length} 項，未抽選 ${unDrawnFiltered.length} 項`;
            }
        }

        function saveAndRefresh() {
            localStorage.setItem('funbox_drawn_urls', JSON.stringify(Array.from(drawnSet)));
            renderList();
        }

        mainBtn.addEventListener('click', () => {
            let unDrawnFiltered = getFilteredItems().filter(item => !drawnSet.has(item.url));
            if (unDrawnFiltered.length === 0) return;
            let targetItem = unDrawnFiltered[0];
            drawnSet.add(targetItem.url);
            saveAndRefresh();
            let a = document.createElement('a');
            a.href = targetItem.url;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        });

        resetBtn.addEventListener('click', () => {
            if (confirm('確定要清空所有已抽選的記憶紀錄嗎？')) {
                drawnSet.clear();
                localStorage.removeItem('funbox_drawn_urls');
                renderList();
            }
        });

        initFilters();
        renderList();
    </script>
</body>
</html>
