<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Funbox 自動化抽獎面板</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            padding: 20px;
            background-color: #1e1e1e;
            color: white;
            text-align: center;
        }
        .container {
            width: 100%;
            max-width: 600px;
        }
        #mainBtn {
            width: 100%;
            height: 220px;
            font-size: 32px;
            font-weight: bold;
            border-radius: 20px;
            background-color: #06C755;
            color: white;
            border: none;
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(6, 199, 85, 0.4);
            margin-top: 20px;
        }
        #mainBtn:disabled {
            background-color: #555;
            cursor: not-allowed;
        }
        #status {
            margin-top: 20px;
            font-size: 20px;
            color: #00ff00;
        }
        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            margin-top: 10px;
        }
        button.tool-btn {
            padding: 8px 14px;
            background-color: #444;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }
        #listContainer {
            margin-top: 30px;
            text-align: left;
            background: #2a2a2a;
            border-radius: 12px;
            padding: 15px;
            max-height: 300px;
            overflow-y: auto;
        }
        .store-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 10px;
            border-bottom: 1px solid #3c3c3c;
            font-size: 14px;
        }
        .store-status {
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            cursor: pointer;
            font-weight: bold;
        }
        .status-un-drawn { background-color: #ff4444; color: white; }
        .status-drawn { background-color: #2e7d32; color: #ccc; }
    </style>
</head>
<body>

    <div class="container">
        <div class="toolbar">
            <span id="progressText" style="font-size: 16px; color: #aaa;">載入中...</span>
            <button class="tool-btn" id="resetBtn">🔄 全部重設</button>
        </div>

        <button id="mainBtn">👉 載入中... 👈</button>
        <div id="status">請稍候</div>

        <div id="listContainer"></div>
    </div>

    <script>
        // 把你剛才那一大串網址放進這裡（每行都有雙引號和逗號）
        let links = [
            "https://lin.ee/9xvdY8S",
            "https://lin.ee/xxqkyvC",
            "https://lin.ee/yP3r8Lq",
            "https://lin.ee/QrlSYOm",
            "https://lin.ee/TmhBnu9"
            // 你可以繼續往下貼...
        ];

        let drawnStatus = [];
        try {
            drawnStatus = JSON.parse(localStorage.getItem('funbox_drawn_status')) || [];
            if (drawnStatus.length !== links.length) {
                drawnStatus = new Array(links.length).fill(false);
            }
        } catch (e) {
            drawnStatus = new Array(links.length).fill(false);
        }

        const mainBtn = document.getElementById('mainBtn');
        const statusDiv = document.getElementById('status');
        const progressText = document.getElementById('progressText');
        const listContainer = document.getElementById('listContainer');
        const resetBtn = document.getElementById('resetBtn');

        function renderList() {
            listContainer.innerHTML = '';
            let completedCount = 0;

            links.forEach((url, index) => {
                if (drawnStatus[index]) completedCount++;

                let item = document.createElement('div');
                item.className = 'store-item';

                let nameSpan = document.createElement('span');
                nameSpan.innerText = `${index + 1}. ${url}`;

                let statusSpan = document.createElement('span');
                statusSpan.className = `store-status ${drawnStatus[index] ? 'status-drawn' : 'status-un-drawn'}`;
                statusSpan.innerText = drawnStatus[index] ? '已抽選' : '未抽選';
                
                statusSpan.addEventListener('click', () => {
                    drawnStatus[index] = !drawnStatus[index];
                    saveAndRefresh();
                });

                item.appendChild(nameSpan);
                item.appendChild(statusSpan);
                listContainer.appendChild(item);
            });

            progressText.innerText = `已完成: ${completedCount} / ${links.length}`;

            if (completedCount >= links.length) {
                mainBtn.innerText = '🎉\n全部門市都抽完囉！';
                mainBtn.disabled = true;
                statusDiv.innerText = '大功告成！';
            } else {
                mainBtn.innerText = '👉 點我抽下一個 👈';
                mainBtn.disabled = false;
                statusDiv.innerText = '準備抽取下一個';
            }
        }

        function saveAndRefresh() {
            localStorage.setItem('funbox_drawn_status', JSON.stringify(drawnStatus));
            renderList();
        }

        mainBtn.addEventListener('click', () => {
            let nextIndex = drawnStatus.indexOf(false);
            if (nextIndex === -1) {
                alert('所有項目都已經抽完了！');
                return;
            }

            drawnStatus[nextIndex] = true;
            saveAndRefresh();

            let a = document.createElement('a');
            a.href = links[nextIndex];
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        });

        resetBtn.addEventListener('click', () => {
            if (confirm('確定要清空所有紀錄嗎？')) {
                drawnStatus = new Array(links.length).fill(false);
                localStorage.removeItem('funbox_drawn_status');
                renderList();
            }
        });

        renderList();
    </script>
</body>
</html>
