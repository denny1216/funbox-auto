    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Funbox 手動貼上版抽獎面板</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #1e1e1e;
            color: white;
            text-align: center;
        }
        #mainBtn {
            width: 85%;
            height: 250px;
            font-size: 36px;
            font-weight: bold;
            border-radius: 24px;
            background-color: #06C755;
            color: white;
            border: none;
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(6, 199, 85, 0.4);
            transition: transform 0.1s;
            line-height: 1.5;
        }
        #mainBtn:active {
            transform: scale(0.95);
        }
        #mainBtn:disabled {
            background-color: #555;
            box-shadow: none;
            cursor: not-allowed;
            transform: none;
        }
        #status {
            margin-top: 30px;
            font-size: 24px;
            color: #00ff00;
        }
        #resetBtn {
            position: absolute;
            top: 20px;
            right: 20px;
            padding: 10px 15px;
            background-color: #444;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
        }
    </style>
</head>

        const resetBtn = document.getElementById('resetBtn');

        function updateUI() {
            if (currentIndex >= links.length) {
                mainBtn.innerText = '🎉\n全部門市抽完囉！';
                mainBtn.disabled = true;
                statusDiv.innerText = `最終進度：${links.length} / ${links.length}`;

                let currentUrl = links[currentIndex];

                localStorage.setItem('funbox_manual_index', currentIndex.toString());
                updateUI();

                a.href = currentUrl;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
            }
        });

                currentIndex = 0;
                updateUI();
